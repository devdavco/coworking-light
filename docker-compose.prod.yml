# PRODUCCIÓN (p.ej. una instancia EC2). Requiere un fichero .env (ver .env.example):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Solo se publica el puerto 80 (nginx). Postgres y backend quedan en la red interna.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coworking_db}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/coworking_db}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@coworking.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
