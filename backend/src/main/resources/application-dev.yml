# Perfil de desarrollo local (docker compose o IDE con PostgreSQL en localhost).
# Los secretos (DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD) vienen siempre del entorno / .env.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coworking_db}
    username: ${DB_USERNAME:coworking_user}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true

logging:
  level:
    com.coworking: DEBUG
