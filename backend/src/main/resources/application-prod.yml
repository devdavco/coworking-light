# Perfil de producción (EC2 + RDS). Nada hardcodeado y sin valores por defecto:
# si falta alguna variable la aplicación no arranca (fail fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: WARN
    com.coworking: INFO
    org.flywaydb: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
