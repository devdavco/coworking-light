<div class="login-container">
  <div class="login-box">
    <h1>Coworking Booking</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="form-control"
        />
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="error">
          Email es requerido
        </small>
        <small *ngIf="loginForm.get('email')?.hasError('email')" class="error">
          Email inválido
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Tu contraseña"
          class="form-control"
        />
        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="error">
          Contraseña es requerida
        </small>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid || loading"
      >
        {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate aquí</a>
    </p>
  </div>
</div>
