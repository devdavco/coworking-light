<div class="register-container">
  <div class="register-box">
    <h1>Crear Cuenta</h1>
    <p class="subtitle">Regístrate para acceder al sistema</p>

    <div *ngIf="success" class="success-message">
      ¡Registro exitoso! Redirigiendo...
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="form-group">
        <label for="firstName">Nombre:</label>
        <input
          type="text"
          id="firstName"
          formControlName="firstName"
          placeholder="Tu nombre"
          class="form-control"
        />
        <small *ngIf="registerForm.get('firstName')?.hasError('required')" class="error">
          Nombre es requerido
        </small>
      </div>

      <div class="form-group">
        <label for="lastName">Apellido:</label>
        <input
          type="text"
          id="lastName"
          formControlName="lastName"
          placeholder="Tu apellido"
          class="form-control"
        />
        <small *ngIf="registerForm.get('lastName')?.hasError('required')" class="error">
          Apellido es requerido
        </small>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="form-control"
        />
        <small *ngIf="registerForm.get('email')?.hasError('required')" class="error">
          Email es requerido
        </small>
        <small *ngIf="registerForm.get('email')?.hasError('email')" class="error">
          Email inválido
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          class="form-control"
        />
        <small *ngIf="registerForm.get('password')?.hasError('required')" class="error">
          Contraseña es requerida
        </small>
        <small *ngIf="registerForm.get('password')?.hasError('minlength')" class="error">
          Mínimo 8 caracteres
        </small>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="registerForm.invalid || loading"
      >
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
